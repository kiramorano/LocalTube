name: LocalTube release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            python: '3.11'
            archive: LocalTube-windows-x64.zip
            kind: windows
          - name: windows-x86
            os: windows-2022
            python: '3.11'
            architecture: x86
            archive: LocalTube-windows-x86.zip
            kind: windows
          - name: linux-x64
            os: ubuntu-22.04
            python: '3.11'
            archive: LocalTube-linux-x64.tar.gz
            kind: linux
          - name: macos-x64
            os: macos-13
            python: '3.11'
            archive: LocalTube-macos-x64.tar.gz
            kind: macos
          - name: macos-arm64
            os: macos-14
            python: '3.11'
            archive: LocalTube-macos-arm64.tar.gz
            kind: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture || 'x64' }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -r requirements.txt
      - name: Verify source
        run: python -m compileall -q .
      - name: Build application
        run: pyinstaller --noconfirm --clean packaging/localtube.spec
      - name: Package Windows
        if: matrix.kind == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/LocalTube -DestinationPath ${{ matrix.archive }}
      - name: Package Unix
        if: matrix.kind != 'windows'
        run: tar -C dist -czf "${{ matrix.archive }}" LocalTube
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
