name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 👇 ДОБАВЛЯЕМ РАЗРЕШЕНИЯ
permissions:
  contents: write   # нужно для создания релизов

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller flask yt-dlp requests pillow
      - name: Build Windows portable
        run: |
          pyinstaller --onefile --windowed --add-data "templates;templates" --add-data "static;static" app.py --distpath dist -n LocalTube-portable
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 python3-pip
          python -m pip install --upgrade pip
          pip install pyinstaller flask yt-dlp requests pillow
      - name: Build AppImage
        run: |
          pyinstaller --onefile --add-data "templates:templates" --add-data "static:static" app.py --distpath dist -n LocalTube-x86_64
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage dist/LocalTube-x86_64 LocalTube-x86_64.AppImage || echo "AppImage build skipped"
      - name: Build DEB
        run: |
          mkdir -p localtube_amd64/usr/local/bin
          cp dist/LocalTube-x86_64 localtube_amd64/usr/local/bin/localtube
          mkdir -p localtube_amd64/DEBIAN
          printf "Package: localtube\nVersion: 1.0.0\nArchitecture: amd64\nMaintainer: LocalTube\nDescription: Local video server\n" > localtube_amd64/DEBIAN/control
          dpkg-deb --build localtube_amd64 localtube_amd64.deb
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            LocalTube-x86_64.AppImage
            localtube_amd64.deb

  upload-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create source archive
        run: |
          tar -czf LocalTube-source.tar.gz *.py requirements.txt templates/ static/ .github/
          ls -lh LocalTube-source.tar.gz
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-builds/*.exe
            linux-builds/*.AppImage
            linux-builds/*.deb
            LocalTube-source.tar.gz
          body: |
            ## LocalTube v1.0.0 - Все платформы
            
            ### Исправления
            - Backend: requirements.txt, валидация yt-dlp, проверка синтаксиса
            - Frontend: адаптивный UI для мобильных, боковое меню, формы, доступность
            
            ### Загрузки
            - **Windows**: LocalTube-portable.exe (все версии)
            - **Linux**: AppImage (portable) + deb пакет
            - **Source**: полный исходный код
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}