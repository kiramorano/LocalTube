name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Gradle 8.9
        run: wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /tmp && echo /tmp/gradle-8.9/bin >> $GITHUB_PATH
      # Проект собирается через ABI splits, product flavors в нём нет:
      # задач assembleMobileDebug/assembleTvDebug не существует.
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LocalTube-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
