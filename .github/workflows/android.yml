name: Android APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Gradle 8.9
        run: wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip && unzip -q /tmp/gradle.zip -d /tmp && echo /tmp/gradle-8.9/bin >> $GITHUB_PATH
      - run: gradle --no-daemon :app:assembleMobileDebug :app:assembleTvDebug
      - uses: actions/upload-artifact@v4
        with: { name: LocalTube-Android-mobile-debug, path: android/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk, if-no-files-found: error }
      - uses: actions/upload-artifact@v4
        with: { name: LocalTube-Android-TV-debug, path: android/app/build/outputs/apk/tv/debug/app-tv-debug.apk, if-no-files-found: error }
