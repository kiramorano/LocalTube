# 4 ГБ, а не 2: с двумя флейворами (mobile и tv) вариантов стало вдвое больше, и
# сборка нескольких сразу падала в OutOfMemoryError на слиянии dex. Ошибка при
# этом выглядела как невнятный сбой упаковки, без упоминания памяти.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
android.useAndroidX=true
android.nonTransitiveRClass=true
# Путь к проекту может содержать не-ASCII символы: AGP иначе отказывается собирать.
android.overridePathCheck=true
kotlin.daemon.jvmargs=-Xmx1536M -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US

# Lint-service падает на JDK 26 (Failed to stop LintClassLoaderBuildService).
# Отключаем проверку для сборки release: требуется APK, а не анализ кода.
android.lint.abortOnError=false
android.lint.checkReleaseTasks=false
