plugins { id 'com.android.application' }

android {
    namespace 'io.github.kiramorano.localtube'
    compileSdk 35

    defaultConfig {
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    flavorDimensions += 'device'
    productFlavors {
        mobile { dimension 'device'; applicationId 'io.github.kiramorano.localtube.mobile' }
        tv { dimension 'device'; applicationId 'io.github.kiramorano.localtube.tv' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.3'
}
