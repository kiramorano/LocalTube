plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.localtube.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.localtube.app"
        // Android 6.0+ (Chaquopy 15.0.1 поддерживает minSdk 21,
        // но для API 23 гарантированно работает динамический линкер с 64-битными ABI)
        minSdk 23
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "1")
        versionName(System.getenv("ANDROID_VERSION_NAME") ?: "1.0.0")

        // Универсальный APK: и 64-битные, и 32-битные устройства
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        python {
            version "3.11"
            pip {
                install "flask"
                install "requests"
                install "yt-dlp"
                install "Pillow"
            }
        }
    }

    // Нативные библиотеки (ffmpeg/ffprobe) должны быть распакованы на диск,
    // чтобы их можно было исполнять как обычные бинарники
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Подписываем debug-ключом, чтобы APK ставился сразу из релиза.
            // Для публикации в магазины замените на собственный keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
