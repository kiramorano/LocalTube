plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'io.github.kiramorano.localtube'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.kiramorano.localtube"
        // Android 8.0: требование задачи. Заодно снимает проблему с
        // NotificationChannel, которого нет на API 24-25.
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "1.8.5"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    /**
     * Два варианта приложения: для телефонов и планшетов и отдельный для
     * телевизоров. Разделение нужно из-за манифеста: ТВ-сборка объявляет
     * leanback обязательным (иначе Play не признаёт её ТВ-приложением), а
     * мобильная — необязательным, и в одном манифесте это несовместимо.
     *
     * applicationId одинаковый: обе сборки — одно приложение, и разные id
     * означали бы, что при переходе с телефона на ТВ библиотека и настройки
     * не переносятся.
     */
    flavorDimensions += 'device'

    productFlavors {
        mobile {
            dimension 'device'
            versionNameSuffix ''
        }
        tv {
            dimension 'device'
            // Суффикс в имени, а не в id: помогает отличить APK, но не делает
            // из ТВ-сборки отдельное приложение.
            versionNameSuffix '-tv'
        }
    }

    def releaseKeystore = file('keystore.jks')

    signingConfigs {
        release {
            if (releaseKeystore.exists()) {
                storeFile releaseKeystore
                storePassword System.getenv('LT_STORE_PASSWORD')
                keyAlias System.getenv('LT_KEY_ALIAS')
                keyPassword System.getenv('LT_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Без keystore подписываем отладочным ключом. Раньше в этой ветке
            // подпись не назначалась вовсе, и сборка давала
            // app-*-release-unsigned.apk — установить такой APK невозможно,
            // то есть артефакты CI были бесполезны.
            signingConfig releaseKeystore.exists()
                ? signingConfigs.release
                : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ''
        }
    }
    splits {
        abi {
            enable true
            reset()
            // x86_64 нужен для эмулятора: без него проверить сборку негде.
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    testOptions {
        unitTests.returnDefaultValues = true
        // Robolectric поднимает Android в JVM: Compose-экраны проверяются
        // обычным testDebugUnitTest, без эмулятора и подключённого телефона.
        unitTests.includeAndroidResources = true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/LICENSE-notice.md']
        }
        jniLibs {
            // Обязательно вместе с extractNativeLibs="true" в манифесте:
            // youtubedl-android распаковывает Python и FFmpeg на диск.
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // Адаптивная вёрстка: телефон, планшет и ТВ отличаются размером окна.
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.4'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    // MediaSession: фоновое воспроизведение и управление с системных панелей.
    implementation 'androidx.media3:media3-session:1.5.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    // QR с адресом раздачи. Только кодирование, без камеры и без сети: на
    // сервере ту же роль играет segno (access.py: make_qr_png).
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    // UI-тесты экранов. Раньше композиция не проверялась ничем: экраны
    // считались рабочими, если компилируются, и любая ошибка вёрстки или
    // навигации доезжала до устройства.
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    // ApplicationProvider: тестам нужен доступ к репозиторию, чтобы сбрасывать
    // состояние очереди между прогонами.
    testImplementation 'androidx.test:core-ktx:1.6.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
